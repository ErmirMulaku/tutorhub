<button type="button" class="topbar__menu" aria-label="Open menu" (click)="toggleSidebar()">
  <svg th-icon="menu"></svg>
</button>
<div class="topbar__heading">
  <h1 class="topbar__title">{{ meta().title }}</h1>
  @if (meta().subtitle) {
    <p class="topbar__subtitle">{{ meta().subtitle }}</p>
  }
</div>

<div class="topbar__actions">
  <form class="topbar__search" (submit)="onSearch($event)">
    <svg th-icon="search" class="topbar__search-icon"></svg>
    <input
      type="search"
      placeholder="Search students, lessons…"
      aria-label="Search"
      [value]="query()"
      (input)="onQueryInput($event)"
    />
  </form>

  <button
    type="button"
    class="topbar__pill"
    [class.topbar__pill--on]="online()"
    [attr.aria-pressed]="online()"
    (click)="toggleOnline()"
  >
    <span class="topbar__dot"></span>
    {{ online() ? 'Online' : 'Hidden' }}
  </button>

  <div class="topbar__accents" role="group" aria-label="Accent colour">
    @for (a of accents; track a.key) {
      <button
        type="button"
        class="topbar__accent"
        [class.topbar__accent--active]="accent() === a.key"
        [style.background]="a.swatch"
        [title]="a.label"
        [attr.aria-label]="a.label"
        [attr.aria-pressed]="accent() === a.key"
        (click)="setAccent(a.key)"
      ></button>
    }
  </div>

  <button
    type="button"
    class="topbar__icon-btn"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    <svg [th-icon]="theme() === 'dark' ? 'sun' : 'moon'"></svg>
  </button>

  <th-notifications-bell />

  <button th-button size="sm" (click)="openNewLesson()">New lesson</button>
</div>
