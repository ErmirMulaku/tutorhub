<div class="login">
  <div class="login__panel">
    <div class="login__brand">
      Tutor<strong>Hub</strong> <span class="login__eyebrow">FOR TUTORS</span>
    </div>

    @if (phase() === 'verify') {
      <th-verify-panel
        [email]="form.controls.email.value"
        [initialDevCode]="devCode()"
        [initialDemoCode]="demoCode()"
        (verified)="onVerified($event)"
      >
        <p class="login__subtitle">
          We sent a 6-digit code to <strong>{{ form.controls.email.value }}</strong
          >.
        </p>
      </th-verify-panel>
    } @else {
      <h1 class="login__title">Create your account</h1>
      <p class="login__subtitle">Start tutoring in minutes — it's free to join.</p>

      <form class="login__form" ngNativeValidate [formGroup]="form" (ngSubmit)="signUp()">
        <label class="login__field">
          <span>Full name</span>
          <input type="text" formControlName="fullName" autocomplete="name" required />
        </label>
        <label class="login__field">
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="username" required />
        </label>
        <label class="login__field">
          <span>Password</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </label>
        <label class="login__field">
          <span>Confirm password</span>
          <input
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </label>
        @if (error(); as message) {
          <p class="login__error">{{ message }}</p>
        }
        <button th-button type="submit" block [disabled]="busy()">
          {{ busy() ? 'Creating account…' : 'Create account' }}
        </button>
      </form>

      <p class="login__alt">Already have an account? <a routerLink="/login">Sign in</a></p>
    }
  </div>
</div>
