<th-modal [open]="open()" title="New lesson" (closed)="close()">
  <form class="svc-form" (submit)="submit($event)">
    <label class="login__field">
      <span>Student</span>
      <!-- [selected] per option, not [value] on the <select>: the options
           render after the select's own bindings, so a select-level value
           could be applied before the matching option exists. -->
      <select required (change)="studentId.set(value($event))">
        @for (s of students.data() ?? []; track s.id) {
          <option [value]="s.id" [selected]="s.id === studentId()">{{ s.fullName }}</option>
        }
      </select>
    </label>
    <label class="login__field">
      <span>Subject</span>
      <select required (change)="subjectId.set(value($event))">
        @for (s of subjects.data() ?? []; track s.id) {
          <option [value]="s.id" [selected]="s.id === subjectId()">
            {{ s.name }} · {{ s.level.toLowerCase() }}
          </option>
        }
      </select>
    </label>
    <label class="login__field">
      <span>Date & time</span>
      <input
        type="datetime-local"
        required
        [value]="startTime()"
        (input)="startTime.set(value($event))"
      />
    </label>
    <button th-button type="submit" block [disabled]="creating() || !studentId() || !subjectId()">
      {{ creating() ? 'Booking…' : 'Book lesson' }}
    </button>
  </form>
</th-modal>
