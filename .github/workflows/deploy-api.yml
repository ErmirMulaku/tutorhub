name: Deploy API

# Builds the API image and rolls it out to App Runner (eu-central-1).
#
# One-time setup this workflow assumes:
#   - An ECR repository (vars.ECR_REPOSITORY, e.g. `tutorhub-api`).
#   - An App Runner service pointed at that repository
#     (secrets.APPRUNNER_SERVICE_ARN).
#   - An IAM role GitHub can assume via OIDC (secrets.AWS_DEPLOY_ROLE_ARN),
#     trusted for this repo, allowing ecr:* on the repo plus
#     apprunner:StartDeployment / apprunner:DescribeService / ListOperations.
#     OIDC avoids storing long-lived AWS keys in GitHub.
#
# Migrations are NOT run here — see the note at the bottom of the file.

on:
  push:
    branches: [master]
    # The API is a workspace package: a change to packages/* or the lockfile
    # changes the image even when services/api is untouched.
    paths:
      - 'services/api/**'
      - 'packages/**'
      - 'proto/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  # Never cancel a rollout midway; queue instead.
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: tutorhub-gateway
  ECS_SERVICE: tutorhub-gateway-svc
  ECS_TASK_FAMILY: tutorhub-gateway

jobs:
  deploy:
    name: Build · Push · Roll out
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Build context is the REPO ROOT: the API is an npm-workspace package
          # and its Dockerfile copies packages/* manifests.
          context: .
          file: services/api/Dockerfile
          # App Runner runs x86_64 — an arm64 image built on Apple Silicon or an
          # arm runner will not start.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out to ECS
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          TD=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition --output json)
          NEW=$(echo "$TD" | jq --arg IMG "$IMAGE" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                .compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions[0].image = $IMG')
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $ARN"
          aws ecs update-service --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" --task-definition "$ARN" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Smoke check
        run: |
          curl -sf https://api.tutorhub.ermir-mulaku.com/health
          curl -sf -o /dev/null -X POST https://api.tutorhub.ermir-mulaku.com/graphql \
            -H 'content-type: application/json' \
            -d '{"query":"{__typename}"}'
          echo "API answered /health and GraphQL"

# ── Migrations ───────────────────────────────────────────────────────────────
# `prisma migrate deploy` is deliberately not run here. It needs to reach the
# database, which this runner cannot do unless the instance is publicly
# reachable, and an auto-deploy that migrates on every merge to master can drop
# or rewrite columns with no review step and no staging environment to catch it.
#
# Run migrations yourself as a release step BEFORE merging a schema change:
#   DATABASE_URL='<prod url>' \
#     npx prisma migrate deploy --schema services/api/prisma/schema.prisma
#
# Since this workflow auto-deploys, a merge containing both a migration and the
# code that needs it will ship the code first. Order accordingly: migrate, then
# merge.
