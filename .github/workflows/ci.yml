name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · E2E
    runs-on: ubuntu-latest
    env:
      # Skip Husky hook installation in CI (no commits happen here).
      HUSKY: '0'
      DATABASE_URL: postgresql://tutorhub:tutorhub@localhost:5432/tutorhub?schema=public
      JWT_SECRET: test-secret
      # dashboard-ng's Karma run: Angular's built-in launcher with Chrome's
      # sandbox off — the runner's kernel may refuse the sandbox's namespaces.
      KARMA_BROWSER: ChromeHeadlessNoSandbox
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutorhub
          POSTGRES_PASSWORD: tutorhub
          POSTGRES_DB: tutorhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorhub -d tutorhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run-many -t lint

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Test
        run: npx nx run-many -t test

      - name: Build
        run: npx nx run-many -t build

      - name: Apply database migrations
        run: npm run db:deploy --workspace @ermulaku/api

      # Kafka-compatible broker for the outbox/Kafka E2E tests (Block 4). Run
      # with `docker run`, not as a job `services:` container, because
      # Redpanda needs start-up flags and service containers can't pass a
      # command.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.6 \
            redpanda start --mode=dev-container --smp=1 \
            --kafka-addr=0.0.0.0:9092 --advertise-kafka-addr=localhost:9092
          for i in $(seq 1 60); do
            if docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true'; then
              echo "Redpanda is up"; exit 0
            fi
            sleep 2
          done
          echo "Redpanda failed to start" >&2; docker logs redpanda >&2; exit 1

      - name: E2E tests
        run: npm run test:e2e --workspace @ermulaku/api
        # A failing Kafka test can leave a connection open so Jest never exits;
        # fail the step instead of waiting for the 6-hour job limit.
        timeout-minutes: 15
        env:
          KAFKA_BROKERS: localhost:9092

  marketplace-e2e:
    name: Marketplace · Cypress · Lighthouse
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      DATABASE_URL: postgresql://tutorhub:tutorhub@localhost:5432/tutorhub?schema=public
      JWT_SECRET: test-secret
      API_URL: http://localhost:4000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutorhub
          POSTGRES_PASSWORD: tutorhub
          POSTGRES_DB: tutorhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorhub -d tutorhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and marketplace
        run: npx nx run-many -t build -p @ermulaku/api @ermulaku/marketplace

      - name: Migrate and seed the database
        run: |
          npm run db:deploy --workspace @ermulaku/api
          npm run db:seed --workspace @ermulaku/api

      - name: Start the API
        run: |
          node services/api/dist/main.js &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -X POST http://localhost:4000/graphql \
              -H 'content-type: application/json' -d '{"query":"{__typename}"}'; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2; exit 1

      - name: Lighthouse budget
        run: npm run lhci --workspace @ermulaku/marketplace

      - name: Re-seed before the booking E2E
        run: npm run db:seed --workspace @ermulaku/api

      - name: Cypress search-to-book E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/marketplace
          install: false
          start: npm run start
          wait-on: 'http://localhost:3200/en'
          wait-on-timeout: 120

  dashboard-ng-e2e:
    name: Dashboard (Angular) · Cypress
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only the dashboard and its workspace deps — the same install Vercel runs.
      # A full `npm ci` would also run services/api's `postinstall`
      # (`prisma generate`), which needs DATABASE_URL this job has no use for.
      - name: Install dependencies
        run: npm ci --workspace=@ermulaku/dashboard-ng --include-workspace-root

      # The API is faked with cy.intercept fixtures, so no database or API
      # server is started here — only the Angular dev server. It's started and
      # awaited here rather than through the action's `start` / `wait-on`, whose
      # probe failed on its first attempt ("Socket closed before the connection
      # was established") instead of retrying; curl tries IPv6 and IPv4 and the
      # loop retries. The server keeps running into the next step.
      - name: Start the dashboard dev server
        working-directory: apps/dashboard-ng
        run: |
          npm run dev > /tmp/ng-serve.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3100/; then
              echo "Dev server is up"; exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start" >&2; cat /tmp/ng-serve.log >&2; exit 1

      - name: Cypress E2E (fixtures)
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/dashboard-ng
          install: false

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ng-cypress-screenshots
          path: apps/dashboard-ng/cypress/screenshots
          if-no-files-found: ignore

  notifications:
    name: Notifications (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            services/notifications/deps
            services/notifications/_build
          key: mix-${{ runner.os }}-${{ hashFiles('services/notifications/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test
