# Local PostgreSQL for services/api. Not used in production (managed Postgres,
# e.g. Amazon RDS; SPEC §14).
#   docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: tutorhub-db
    environment:
      POSTGRES_USER: tutorhub
      POSTGRES_PASSWORD: tutorhub
      POSTGRES_DB: tutorhub
    ports:
      - '5432:5432'
    volumes:
      - tutorhub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutorhub -d tutorhub']
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate limiting + response caching for the AI gateway (AI_GATEWAY_RAG_SPEC
  # Block 0). Not used in production (managed Redis, e.g. ElastiCache).
  #   docker compose up -d redis
  redis:
    image: redis:7-alpine
    container_name: tutorhub-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka-compatible broker for booking events (FRESHA_DEPTH_SPEC Block 4):
  # the API's outbox relay publishes to `tutorhub.bookings.v1`; the
  # notification consumers read it. Single container, dev mode, no ZooKeeper.
  # Not used in production (managed Kafka, e.g. Amazon MSK / Confluent).
  #   docker compose up -d redpanda
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: tutorhub-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:9092
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tutorhub-db-data:
